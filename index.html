<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยเขียนโค้ด AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#17202e;--muted:#667085;--line:#d9dfe9;--accent:#2b4fd8;--accent-ink:#fff;--user:#2b4fd8;--user-ink:#fff;--code:#0f1729;--code-ink:#e6ebf5;--code-bar:#1a2440;--inline:#e3e8f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121c;--surface:#151c2b;--ink:#e8ecf4;--muted:#93a0b8;--line:#263148;--accent:#7b97ff;--accent-ink:#0d121c;--user:#2b4fd8;--user-ink:#fff;--code:#080c15;--code-bar:#141c30;--inline:#222c42}}
:root[data-theme="dark"]{--bg:#0d121c;--surface:#151c2b;--ink:#e8ecf4;--muted:#93a0b8;--line:#263148;--accent:#7b97ff;--accent-ink:#0d121c;--user:#2b4fd8;--user-ink:#fff;--code:#080c15;--code-bar:#141c30;--inline:#222c42}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0;font-weight:600}
header p{margin:0;font-size:13px;color:var(--muted)}
.clear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;width:100%;max-width:100%}
.msg.ai p{margin:0 0 10px;white-space:pre-wrap}
.msg.ai code.i{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline);padding:1px 5px;border-radius:4px}
.block{border-radius:10px;overflow:hidden;margin:6px 0 12px;background:var(--code)}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--code-bar);padding:6px 10px;color:#9fb0d3;font-size:12px;font-family:"JetBrains Mono",monospace}
.bar button{background:none;border:1px solid #3a4870;color:#cfd9f2;border-radius:6px;padding:3px 10px;font:inherit;cursor:pointer}
.bar button:focus-visible,.clear:focus-visible,#send:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0;padding:12px;overflow-x:auto;color:var(--code-ink);font:13px/1.55 "JetBrains Mono",ui-monospace,monospace}
.empty{margin:auto;text-align:center;color:var(--muted);padding:12px}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.err{color:#c0392b;font-size:14px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;max-height:140px}
textarea:focus{outline:2px solid var(--accent);outline-offset:0}
#send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
body{background:radial-gradient(circle at 12% -8%,rgba(43,79,216,.16),transparent 42%),radial-gradient(circle at 100% 0,rgba(255,176,32,.14),transparent 36%),var(--bg)}
header{background:linear-gradient(120deg,#1b2f8f,#2b4fd8 60%,#4a6cf0);color:#fff;border:0}
header p{color:#cdd8ff}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:11px;background:#ffc53d;color:#1b2f8f;display:grid;place-items:center;font:600 15px "JetBrains Mono",monospace;flex:none}
.clear{color:#e6ecff;border-color:rgba(255,255,255,.45)}
.grp{display:flex;gap:6px}
iframe{width:100%;height:360px;border:0;background:#fff;display:block}
.empty h2{font-size:25px}
.chip{border-color:var(--accent);color:var(--accent)}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;box-sizing:border-box}
.rt{display:flex;align-items:center;gap:8px}
.who{font-size:13px;color:#dfe7ff;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">&lt;/&gt;</div><div><h1>ผู้ช่วยเขียนโค้ด AI</h1><p>สั่งเป็นภาษาไทย ได้โค้ดและดูตัวอย่างเว็บทันที</p></div></div>
    <button class="clear" id="clear" type="button">ล้างแชท</button>
  </header>
  <div id="log">
    <div class="empty" id="empty">
      <h2>อยากให้ช่วยเขียนอะไร</h2>
      <div>เลือกตัวอย่างหรือพิมพ์เองได้เลย</div>
      <div class="chips">
        <button class="chip" type="button">เขียนฟังก์ชัน Python เรียงลิสต์แบบ merge sort</button>
        <button class="chip" type="button">สร้างหน้าเว็บร้านกาแฟ สวยๆ มีเมนูและปุ่มสั่งซื้อ</button>
        <button class="chip" type="button">อธิบายโค้ดนี้ให้หน่อย: [x*2 for x in range(5)]</button>
      </div>
    </div>
  </div>
  <form id="form">
    <textarea id="in" rows="1" placeholder="พิมพ์คำสั่ง เช่น เขียนโค้ดดึงข้อมูลจาก API" aria-label="ข้อความ"></textarea>
    <button id="send" type="submit">ส่ง</button>
  </form>
</div>
<script>
var log = document.getElementById('log'), input = document.getElementById('in'),
    send = document.getElementById('send'), form = document.getElementById('form');
var chat = [], busy = false, ctrl = null;


function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function scrollDown(){ log.scrollTop = log.scrollHeight; }

function inlineText(parent, text){
  text.split(/(`[^`\n]+`)/g).forEach(function(part){
    if(part.length > 2 && part[0] === '`' && part[part.length-1] === '`') parent.appendChild(el('code','i',part.slice(1,-1)));
    else if(part) parent.appendChild(document.createTextNode(part));
  });
}

function render(box, text){
  box.textContent = '';
  var parts = text.split(/```/);
  parts.forEach(function(part, i){
    if(i % 2 === 0){
      var t = part.replace(/^\n+|\n+$/g,'');
      if(t){ var p = el('p'); inlineText(p, t); box.appendChild(p); }
    } else {
      var nl = part.indexOf('\n'), lang = nl > -1 ? part.slice(0,nl).trim() : '', code = nl > -1 ? part.slice(nl+1) : part;
      code = code.replace(/\n$/,'');
      var b = el('div','block'), bar = el('div','bar'), btn = el('button',null,'คัดลอก');
      btn.type = 'button';
      btn.onclick = function(){
        var done = function(){ btn.textContent = 'คัดลอกแล้ว'; setTimeout(function(){ btn.textContent = 'คัดลอก'; }, 1500); };
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback);
        else fallback();
        function fallback(){ var ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
      };
      bar.appendChild(el('span',null,lang || 'code'));
      var grp = el('span','grp');
      if(/^html?$/i.test(lang) && /<body|<div|<h1|<\/html>/i.test(code)){
        var pv = el('button',null,'ดูตัวอย่าง'); pv.type = 'button';
        pv.onclick = function(){
          var f = b.querySelector('iframe');
          if(f){ f.remove(); pv.textContent = 'ดูตัวอย่าง'; }
          else { f = document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts'); f.title = 'ตัวอย่างเว็บ'; f.srcdoc = code; b.appendChild(f); pv.textContent = 'ปิดตัวอย่าง'; }
        };
        grp.appendChild(pv);
      }
      grp.appendChild(btn); bar.appendChild(grp);
      var pre = el('pre'); pre.appendChild(el('code',null,code));
      b.appendChild(bar); b.appendChild(pre); box.appendChild(b);
    }
  });
}

async function callApi(messages, signal, onText){
  var res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: messages}), signal: signal});
  if(!res.ok){
    var data = {}; try{ data = await res.json(); }catch(e){}
    var err = new Error(data.error || ('HTTP ' + res.status)); err.code = res.status === 429 ? 'rate_limited' : null; throw err;
  }
  var reader = res.body.getReader(), dec = new TextDecoder(), full = '';
  while(true){
    var s = await reader.read(); if(s.done) break;
    full += dec.decode(s.value, {stream:true});
    onText(full.replace(/\u0001\w+/g,''));
  }
  var trunc = full.indexOf('\u0001TRUNC') > -1;
  full = full.replace(/\u0001\w+/g,'');
  if(!full) throw new Error('AI ไม่ได้ส่งคำตอบกลับมา ลองถามใหม่อีกครั้ง');
  return {text: full, truncated: trunc};
}

async function ask(text){
  if(busy || !text.trim()) return;
  busy = true; send.disabled = true;
  var empty = document.getElementById('empty'); if(empty) empty.remove();
  log.appendChild(el('div','msg user',text));
  chat.push({role:'user', content:text});
  var box = el('div','msg ai'); box.appendChild(el('p',null,'กำลังคิด...')); log.appendChild(box); scrollDown();
  var msgs = chat.slice(-12).map(function(m){ return {role:m.role, content:m.content}; });
  while(msgs.length && msgs[0].role !== 'user') msgs.shift();
  
  ctrl = new AbortController();
  try{
    var r = await callApi(msgs, ctrl.signal, function(t){ render(box, t); scrollDown(); });
    render(box, r.text); chat.push({role:'assistant', content:r.text});
    if(r.truncated){ box.appendChild(el('p','err','คำตอบยาวจนถูกตัด พิมพ์ "เขียนต่อ" เพื่อให้ทำต่อ')); }
  }catch(e){
    box.textContent = '';
    var code = e && e.code;
    var msg = code === 'not_granted' ? 'ยังไม่ได้อนุญาตให้ใช้ AI กดส่งใหม่แล้วเลือกอนุญาต'
            : code === 'rate_limited' ? 'ใช้งานถี่เกินไปหรือโควตาเต็ม: ' + ((e && e.message) || '')
            : code === 'not_declared' || code === 'sampling_disabled' || code === 'capability_disabled' ? 'ฟีเจอร์ AI ยังไม่เปิดใช้งานสำหรับหน้านี้ (' + code + ')'
            : 'เกิดข้อผิดพลาด ลองส่งอีกครั้ง (' + (code || (e && e.message) || 'unknown') + ')';
    if(e && e.text){ render(box, e.text); }
    box.appendChild(el('p','err',msg));
    chat.pop();
  }
  busy = false; send.disabled = false; scrollDown(); input.focus();
}

form.addEventListener('submit', function(e){ e.preventDefault(); var t = input.value; input.value = ''; input.style.height = 'auto'; ask(t); });
input.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 700){ e.preventDefault(); form.requestSubmit(); } });
input.addEventListener('input', function(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
var emptyHTML = document.getElementById('empty').outerHTML;
function bindChips(){ document.querySelectorAll('.chip').forEach(function(c){ c.onclick = function(){ ask(c.textContent); }; }); }
bindChips();
document.getElementById('clear').onclick = function(){ if(ctrl) ctrl.abort(); chat = []; location.reload(); };
</script>
</body>
</html>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-35%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,46,154,.28),rgba(138,92,255,.28),rgba(0,229,255,.24),rgba(61,255,122,.16),rgba(255,204,0,.18),rgba(255,46,154,.28));filter:blur(70px);animation:spin 45s linear infinite;will-change:transform}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0}
.sparks i{position:absolute;border-radius:50%;opacity:0;animation:twinkle 3s ease-in-out infinite}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:rgba(10,6,21,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{position:relative;width:48px;height:48px;border-radius:50%;flex:none}
.logo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff2e9a,#ffcc00,#3dff7a,#00e5ff,#8a5cff,#ff2e9a);animation:spin 5s linear infinite;box-shadow:0 0 16px rgba(255,46,154,.6)}
.logo span{position:absolute;inset:2px;border-radius:50%;background:var(--logo) center/cover,#000}
header h1{margin:0;font:700 20px/1.2 "Orbitron","IBM Plex Sans Thai",sans-serif;letter-spacing:.06em;background:var(--rainbow);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
header p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.rt{display:flex;gap:8px}
.clear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:transform .12s,border-color .15s,color .15s,box-shadow .15s}
.clear:hover{border-color:var(--pink);color:#fff;box-shadow:0 0 12px rgba(255,46,154,.45)}
.clear:active{transform:scale(.94)}
#log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:92%;word-wrap:break-word;overflow-wrap:anywhere;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;font-weight:500;box-shadow:0 0 20px rgba(255,46,154,.35)}
.msg.ai{position:relative;align-self:flex-start;width:100%;max-width:100%;background:rgba(15,10,29,.86);border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:4px 16px 16px 16px;padding:12px 14px 12px 58px;box-sizing:border-box;box-shadow:0 0 24px rgba(138,92,255,.14);min-height:60px}
.msg.ai::before{content:"";position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--logo) center/cover,#000;box-shadow:0 0 0 2px var(--pink),0 0 14px rgba(255,46,154,.6)}
.msg.ai p{margin:0 0 10px;white-space:pre-wrap}
.msg.ai code.i{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;background:#221742;color:#ffb3dd;padding:1px 6px;border-radius:5px}
.block{border-radius:12px;overflow:hidden;margin:8px 0 12px;background:#06030f;border:1px solid #3a2a66;box-shadow:0 0 18px rgba(0,229,255,.1);margin-left:-44px}
.bar{display:flex;justify-content:space-between;align-items:center;background:#130b28;padding:7px 10px;color:var(--cyan);font-size:12px;font-family:"JetBrains Mono",monospace}
.grp{display:flex;gap:6px}
.bar button{background:none;border:1px solid #4a3585;color:#e9ddff;border-radius:6px;padding:3px 10px;font:inherit;cursor:pointer;transition:transform .12s,border-color .15s,box-shadow .15s}
.bar button:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.4)}
.bar button:active{transform:scale(.94)}
.bar button:focus-visible,.clear:focus-visible,#send:focus-visible,.chip:focus-visible,.mode:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
pre{margin:0;padding:13px;overflow-x:auto;color:#eaf6ff;font:13px/1.6 "JetBrains Mono",ui-monospace,monospace}
iframe{width:100%;height:360px;border:0;background:#fff;display:block}
.empty{margin:auto 0;padding:8px 2px;text-align:center}
.hero{width:min(58vw,230px);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;background:var(--logo) center/cover,#000;animation:float 4.5s ease-in-out infinite,pulse 3.2s ease-in-out infinite}
.empty h2{font-size:28px;line-height:1.25;letter-spacing:-.01em;margin:0 0 6px;animation:rise .6s cubic-bezier(.2,.8,.2,1) .05s both}
.empty>div:nth-of-type(2){color:var(--muted);animation:rise .6s cubic-bezier(.2,.8,.2,1) .12s both}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.chip{background:rgba(15,10,29,.82);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 15px;font:inherit;font-size:15px;text-align:left;cursor:pointer;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s,box-shadow .15s,border-color .15s}
.chip::before{content:"> ";color:var(--pink);font-family:"JetBrains Mono",monospace}
.chip:nth-child(1){animation-delay:.2s}.chip:nth-child(2){animation-delay:.3s}.chip:nth-child(3){animation-delay:.4s}
.chip:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:0 0 18px rgba(255,46,154,.45)}
.chip:active{transform:scale(.97)}
.err{color:#ff7a8a;font-size:14px}
.msg.ai p.dots{display:flex;gap:7px;margin:0;padding:12px 0 6px}
.dots i{width:9px;height:9px;border-radius:50%;animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(1){background:var(--pink);box-shadow:0 0 8px var(--pink)}
.dots i:nth-child(2){background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation-delay:.15s}
.dots i:nth-child(3){background:#ffcc00;box-shadow:0 0 8px #ffcc00;animation-delay:.3s}
.modes{display:flex;gap:6px;align-items:center;padding:8px 16px 0;background:rgba(10,6,21,.78);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mode{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.mode.on{border-color:var(--pink);color:#fff;background:rgba(255,46,154,.16);box-shadow:0 0 12px rgba(255,46,154,.5)}
.modes small{color:var(--muted);font-size:12px;margin-left:4px;line-height:1.3}
form{display:flex;gap:8px;padding:8px 16px 12px;background:rgba(10,6,21,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:#09051a;color:var(--ink);border-radius:14px;padding:11px 13px;font:inherit;max-height:140px;transition:box-shadow .2s,border-color .2s}
textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 16px rgba(255,46,154,.4)}
#send{border:0;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-radius:14px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 0 18px rgba(255,46,154,.5);transition:transform .12s,filter .15s}
#send:hover{filter:brightness(1.12)}
#send:active{transform:scale(.92)}
#send:disabled{opacity:.5;cursor:default}
.keybox{position:fixed;inset:0;z-index:30;background:rgba(3,1,10,.78);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease both}
.keybox[hidden]{display:none}
.kcard{width:100%;max-width:380px;background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;border:1px solid var(--pink);box-shadow:0 0 30px rgba(255,46,154,.35);animation:popin .3s cubic-bezier(.2,.9,.3,1.25) both}
.kcard h2{margin:0 0 6px;font-size:20px}
.kcard p{margin:0 0 12px;color:var(--muted);font-size:14px}
.kcard input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#09051a;color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;margin-bottom:8px}
.kcard p.kmsg{color:#ff7a8a;min-height:1.2em;margin:0 0 10px}
.krow{display:flex;gap:8px;justify-content:flex-end}
.krow button{border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.krow .ks{background:linear-gradient(135deg,var(--violet),var(--pink));border:0;color:#fff;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(255,46,154,.45),0 0 80px rgba(0,229,255,.18)}50%{box-shadow:0 0 46px rgba(138,92,255,.6),0 0 110px rgba(255,46,154,.3)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sparks i{opacity:.6}}

.msg.ai h3{font-size:17px;margin:10px 0 6px;color:#ffd1ec}
.msg.ai h4{font-size:15px;margin:8px 0 4px;color:#cfe9ff}
.msg.ai ul,.msg.ai ol{margin:0 0 10px;padding-left:22px}
.msg.ai li{margin:2px 0}
.msg.ai strong{color:#fff;font-weight:600}
.bar{gap:8px;align-items:flex-start}

<script>
var log = document.getElementById('log'), input = document.getElementById('in'),
    send = document.getElementById('send'), form = document.getElementById('form');
var chat = [], busy = false, ctrl = null, aiMode = 'fast', STORE = 'sunday_chat_v1', pending = [], lastFiles = [];

function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function nearBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 140; }
function scrollDown(){ log.scrollTop = log.scrollHeight; }
function setBusy(b){ busy = b; send.textContent = b ? 'หยุด' : 'ส่ง'; send.classList.toggle('stop', b); }
function saveChat(){ try{ localStorage.setItem(STORE, JSON.stringify(chat.slice(-40))); }catch(e){} }

function copyText(txt, done){
  function fb(){ var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fb); else fb();
}
var EXT = {html:'html',htm:'html',css:'css',javascript:'js',js:'js',typescript:'ts',ts:'ts',jsx:'jsx',tsx:'tsx',python:'py',py:'py',java:'java',c:'c',cpp:'cpp','c++':'cpp',csharp:'cs',cs:'cs',go:'go',rust:'rs',php:'php',ruby:'rb',bash:'sh',sh:'sh',json:'json',sql:'sql',kotlin:'kt',swift:'swift',yaml:'yml',yml:'yml',md:'md',markdown:'md',xml:'xml'};
function download(code, lang){
  var ext = EXT[(lang || '').toLowerCase()] || 'txt', name = (ext === 'html' ? 'index' : 'code') + '.' + ext;
  var hit = lastFiles.filter(function(f){ return EXT[f.ext] === ext; })[0]; if(hit) name = hit.name;
  var url = URL.createObjectURL(new Blob([code], {type:'text/plain;charset=utf-8'}));
  var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function openPreview(code){ document.getElementById('pvframe').srcdoc = code; document.getElementById('pvbox').hidden = false; }

var KW = 'abstract|and|as|async|await|break|case|catch|class|const|continue|def|default|del|do|elif|else|enum|except|export|extends|false|final|finally|fn|for|from|func|function|go|if|implements|import|in|interface|is|lambda|let|match|new|nil|none|not|null|of|or|package|pass|private|protected|public|pub|raise|return|self|static|struct|super|switch|this|throw|true|try|type|typeof|undefined|use|var|void|while|with|yield|None|True|False|int|float|string|bool|char|double|long|echo|print|println';
var R_C = /\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|\/\/[^\n]*/.source, R_H = /#[^\n]*/.source,
    R_S = /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`/.source,
    R_N = /\b\d+(?:\.\d+)?\b/.source, R_T = /<\/?[a-zA-Z][\w-]*/.source;
function hlRe(hash, html){ return new RegExp('(' + R_C + (hash ? '|' + R_H : '') + ')|(' + R_S + ')|(' + R_N + ')|(\\b(?:' + KW + ')\\b)' + (html ? '|(' + R_T + ')' : ''), 'g'); }
function highlight(target, code, lang){
  var l = (lang || '').toLowerCase();
  var re = hlRe(/^(py|python|sh|bash|shell|zsh|ruby|rb|yaml|yml|r|perl|toml|ini)$/.test(l), /^(html?|xml|svg|vue)$/.test(l));
  var last = 0, m, frag = document.createDocumentFragment();
  while((m = re.exec(code))){
    if(!m[0]){ re.lastIndex++; continue; }
    if(m.index > last) frag.appendChild(document.createTextNode(code.slice(last, m.index)));
    frag.appendChild(el('span', m[1] ? 'tc' : m[2] ? 'ts' : m[3] ? 'tn' : m[4] ? 'tk' : 'tg', m[0]));
    last = m.index + m[0].length;
  }
  if(last < code.length) frag.appendChild(document.createTextNode(code.slice(last)));
  target.appendChild(frag);
}

function inlineText(parent, text){
  text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g).forEach(function(part){
    if(!part) return;
    if(part.length > 2 && part[0] === '`' && part[part.length-1] === '`') parent.appendChild(el('code','i',part.slice(1,-1)));
    else if(part.length > 4 && part.slice(0,2) === '**' && part.slice(-2) === '**') parent.appendChild(el('strong',null,part.slice(2,-2)));
    else parent.appendChild(document.createTextNode(part));
  });
}
function prose(box, t){
  var lines = t.split('\n'), i = 0, para = [], LI = /^\s*([-*•]|\d+[.)])\s+(.*)$/;
  function flush(){ if(para.length){ var p = el('p'); inlineText(p, para.join('\n')); box.appendChild(p); para = []; } }
  while(i < lines.length){
    var L = lines[i], h = L.match(/^\s{0,3}(#{1,4})\s+(.*)$/), li = L.match(LI);
    if(h){ flush(); var hh = el(h[1].length < 3 ? 'h3' : 'h4'); inlineText(hh, h[2]); box.appendChild(hh); i++; }
    else if(li){
      flush(); var ord = /\d/.test(li[1]), list = el(ord ? 'ol' : 'ul');
      while(i < lines.length){ var m = lines[i].match(LI); if(!m || /\d/.test(m[1]) !== ord) break; var it = el('li'); inlineText(it, m[2]); list.appendChild(it); i++; }
      box.appendChild(list);
    }
    else if(!L.trim()){ flush(); i++; }
    else { para.push(L); i++; }
  }
  flush();
}

function render(box, text, final){
  box.textContent = '';
  text.split(/```/).forEach(function(part, i){
    if(i % 2 === 0){ var t = part.replace(/^\n+|\n+$/g,''); if(t) prose(box, t); return; }
    var nl = part.indexOf('\n'), lang = nl > -1 ? part.slice(0, nl).trim() : part.trim(), code = nl > -1 ? part.slice(nl + 1).replace(/\n$/,'') : '';
    var b = el('div','block'), bar = el('div','bar'), grp = el('span','grp');
    function btn(label, fn){ var x = el('button', null, label); x.type = 'button'; x.onclick = function(){ fn(x); }; grp.appendChild(x); }
    bar.appendChild(el('span', null, lang || 'code'));
    if(final){
      if(/^html?$/i.test(lang) && /<body|<div|<h1|<\/html>/i.test(code)){
        btn('ดูตัวอย่าง', function(x){
          var f = b.querySelector('iframe');
          if(f){ f.remove(); x.textContent = 'ดูตัวอย่าง'; }
          else { f = document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts'); f.title = 'ตัวอย่างเว็บ'; f.srcdoc = code; b.appendChild(f); x.textContent = 'ปิดตัวอย่าง'; }
        });
        btn('เต็มจอ', function(){ openPreview(code); });
      }
      btn('ดาวน์โหลด', function(){ download(code, lang); });
      btn('คัดลอก', function(x){ copyText(code, function(){ x.textContent = 'คัดลอกแล้ว'; setTimeout(function(){ x.textContent = 'คัดลอก'; }, 1500); }); });
    }
    bar.appendChild(grp);
    var pre = el('pre'), ce = el('code');
    if(final && code.length < 30000) highlight(ce, code, lang); else ce.textContent = code;
    pre.appendChild(ce); b.appendChild(bar); b.appendChild(pre); box.appendChild(b);
  });
}

function addActions(){
  document.querySelectorAll('.acts').forEach(function(a){ a.remove(); });
  var ais = log.querySelectorAll('.msg.ai'), last = ais[ais.length - 1];
  if(!last || !chat.length || chat[chat.length-1].role !== 'assistant' || last.querySelector('.retry')) return;
  var a = el('div','acts'), rb = el('button',null,'ตอบใหม่'), cb = el('button',null,'คัดลอกคำตอบ');
  rb.type = 'button'; cb.type = 'button'; rb.onclick = regen;
  cb.onclick = function(){ copyText(chat[chat.length-1].content, function(){ cb.textContent = 'คัดลอกแล้ว'; setTimeout(function(){ cb.textContent = 'คัดลอกคำตอบ'; }, 1500); }); };
  a.appendChild(rb); a.appendChild(cb); last.appendChild(a);
}
function regen(){
  if(busy || chat.length < 2) return;
  chat.pop(); var u = chat.pop();
  var ais = log.querySelectorAll('.msg.ai'), uss = log.querySelectorAll('.msg.user');
  if(ais.length) ais[ais.length-1].remove(); if(uss.length) uss[uss.length-1].remove();
  saveChat(); send2(u.content, u.display || u.content, u.display || u.content, []);
}

async function callApi(messages, signal, onText){
  var res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json','x-user-key':getKey()}, body: JSON.stringify({messages: messages, mode: aiMode}), signal: signal});
  if(!res.ok){
    var data = {}; try{ data = await res.json(); }catch(e){}
    var err = new Error(data.error || ('HTTP ' + res.status)); err.code = res.status === 429 ? 'rate_limited' : (res.status === 401 ? 'bad_key' : null); throw err;
  }
  var reader = res.body.getReader(), dec = new TextDecoder(), full = '';
  while(true){
    var s = await reader.read(); if(s.done) break;
    full += dec.decode(s.value, {stream:true});
    onText(full.replace(/\u0001\w+/g,''));
  }
  var trunc = full.indexOf('\u0001TRUNC') > -1;
  full = full.replace(/\u0001\w+/g,'');
  if(!full) throw new Error('AI ไม่ได้ส่งคำตอบกลับมา ลองถามใหม่อีกครั้ง');
  return {text: full, truncated: trunc};
}

function fmtSize(n){ return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB'; }
function extOf(name){ var m = /\.([A-Za-z0-9+]+)$/.exec(name); return m ? m[1].toLowerCase() : ''; }
function buildFull(text, files){
  if(!files.length) return text;
  var out = text + '\n\nไฟล์แนบ (แก้ตามคำสั่งด้านบน และส่งโค้ดที่แก้แล้วทั้งไฟล์):';
  files.forEach(function(f){ out += '\n\n### ไฟล์: ' + f.name + '\n````' + extOf(f.name) + '\n' + f.text + '\n````'; });
  return out;
}
function buildShown(text, files){ return files.length ? text + '\n' + files.map(function(f){ return '📎 ' + f.name; }).join('\n') : text; }
function toast(msg){
  var old = document.querySelector('.toast'); if(old) old.remove();
  var t = el('div','toast',msg); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4200);
}
function renderFiles(){
  var box = document.getElementById('files'); box.textContent = ''; box.hidden = !pending.length;
  pending.forEach(function(f, i){
    var c = el('span','fchip'); c.appendChild(el('span',null,'📎 ' + f.name + ' · ' + fmtSize(f.size)));
    var x = el('button',null,'✕'); x.type = 'button'; x.setAttribute('aria-label','เอาไฟล์ออก');
    x.onclick = function(){ pending.splice(i, 1); renderFiles(); };
    c.appendChild(x); box.appendChild(c);
  });
}
async function addFiles(list){
  var notes = [], MAXF = 4, MAXB = 200 * 1024, MAXT = 300 * 1024;
  for(var k = 0; k < list.length; k++){
    var f = list[k], total = pending.reduce(function(n, p){ return n + p.size; }, 0);
    if(pending.length >= MAXF){ notes.push('แนบได้ไม่เกิน ' + MAXF + ' ไฟล์'); break; }
    if(f.size > MAXB){ notes.push(f.name + ' ใหญ่เกิน 200 KB'); continue; }
    if(total + f.size > MAXT){ notes.push('ไฟล์รวมกันใหญ่เกิน 300 KB'); break; }
    var t = ''; try{ t = await f.text(); }catch(e){ notes.push('อ่าน ' + f.name + ' ไม่ได้'); continue; }
    if(t.indexOf('\u0000') > -1){ notes.push(f.name + ' ไม่ใช่ไฟล์ข้อความหรือโค้ด'); continue; }
    pending.push({name:f.name, size:f.size, text:t});
  }
  renderFiles();
  if(notes.length) toast(notes.join(' · '));
}

function ask(text, files){
  files = files || [];
  if(busy) return;
  if(!text.trim() && !files.length) return;
  if(!getKey()){ input.value = text; openKey('ใส่คีย์ Gemini ก่อนใช้งาน'); return; }
  var typed = text;
  if(!text.trim()) text = 'ช่วยตรวจและแก้บั๊กในไฟล์นี้ แล้วอธิบายสั้นๆ ว่าแก้อะไรบ้าง';
  return send2(buildFull(text, files), buildShown(text, files), typed, files);
}

async function send2(full, shown, typed, files){
  if(busy) return;
  setBusy(true);
  if(files.length){ lastFiles = files.map(function(f){ return {name:f.name, ext:extOf(f.name)}; }); pending = []; renderFiles(); }
  var empty = document.getElementById('empty'); if(empty) empty.remove();
  document.querySelectorAll('.acts').forEach(function(a){ a.remove(); });
  var um = el('div','msg user',shown); log.appendChild(um);
  chat.push({role:'user', content:full, display:shown});
  var box = el('div','msg ai'), dp = el('p','dots'); dp.innerHTML = '<i></i><i></i><i></i>'; box.appendChild(dp); log.appendChild(box); scrollDown();
  var msgs = chat.slice(-12).map(function(m){ return {role:m.role, content:m.content}; });
  while(msgs.length && msgs[0].role !== 'user') msgs.shift();
  ctrl = new AbortController();
  var latest = '', timer = null;
  function paint(){ timer = null; var st = nearBottom(); render(box, latest, false); if(st) scrollDown(); }
  try{
    var r = await callApi(msgs, ctrl.signal, function(t){ latest = t; if(!timer) timer = setTimeout(paint, 90); });
    clearTimeout(timer);
    render(box, r.text, true); chat.push({role:'assistant', content:r.text}); saveChat();
    if(r.truncated){ box.appendChild(el('p','err','คำตอบยาวจนถูกตัด พิมพ์ "เขียนต่อ" เพื่อให้ทำต่อ')); }
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError'){
      if(latest){ render(box, latest, true); chat.push({role:'assistant', content:latest}); saveChat(); box.appendChild(el('p','err','หยุดแล้ว')); }
      else { box.remove(); um.remove(); chat.pop(); input.value = typed; if(files.length){ pending = files; renderFiles(); } }
    } else {
      box.textContent = '';
      var code = e && e.code;
      if(code === 'bad_key'){ openKey('คีย์ใช้ไม่ได้ ตรวจสอบแล้วใส่ใหม่'); }
      var msg = code === 'rate_limited' ? 'ใช้งานถี่เกินไปหรือโควตาเต็ม: ' + ((e && e.message) || '')
              : 'เกิดข้อผิดพลาด (' + ((e && e.message) || 'unknown') + ')';
      box.appendChild(el('p','err',msg));
      var rb = el('button','retry','ลองใหม่'); rb.type = 'button';
      rb.onclick = function(){ box.remove(); um.remove(); send2(full, shown, typed, files); };
      box.appendChild(rb); chat.pop();
    }
  }
  setBusy(false); ctrl = null; addActions(); if(nearBottom()) scrollDown();
}

document.getElementById('attach').onclick = function(){ document.getElementById('fileinp').click(); };
document.getElementById('fileinp').onchange = function(e){ var list = Array.prototype.slice.call(e.target.files || []); e.target.value = ''; addFiles(list); };

form.addEventListener('submit', function(e){
  e.preventDefault();
  if(busy){ if(ctrl) ctrl.abort(); return; }
  var t = input.value; input.value = ''; input.style.height = 'auto'; ask(t, pending.slice());
});
input.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 700){ e.preventDefault(); if(!busy) form.requestSubmit(); } });
input.addEventListener('input', function(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });

bindChips();

var KEY_NAME = 'gemini_key', memKey = '';
function getKey(){ try{ return localStorage.getItem(KEY_NAME) || memKey; }catch(e){ return memKey; } }
function setKey(v){ memKey = v; try{ localStorage.setItem(KEY_NAME, v); }catch(e){} }
var kb = document.getElementById('keybox'), ki = document.getElementById('keyin'), km = document.getElementById('keymsg');
function openKey(msg){ km.textContent = msg || ''; ki.value = ''; kb.hidden = false; ki.focus(); }
document.getElementById('keysave').onclick = function(){ var v = ki.value.trim(); if(v.length < 20){ km.textContent = 'คีย์สั้นเกินไป ตรวจสอบอีกครั้ง'; return; } setKey(v); kb.hidden = true; };
document.getElementById('keycancel').onclick = function(){ kb.hidden = true; };

if(!getKey()) openKey('');

(function(){
  var w = document.createElement('div'); w.className = 'sparks'; w.setAttribute('aria-hidden','true');

(function restore(){
  try{ var d = JSON.parse(localStorage.getItem(STORE) || '[]');
    if(Array.isArray(d)) chat = d.filter(function(m){ return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'; }); }catch(e){}
  if(!chat.length) return;
  var em = document.getElementById('empty'); if(em) em.remove();
  chat.forEach(function(m){
    if(m.role === 'user') log.appendChild(el('div','msg user',m.display || m.content));
    else { var b = el('div','msg ai'); render(b, m.content, true); log.appendChild(b); }
  });
  addActions(); scrollDown();
})();

  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themebtn').textContent = t === 'horror' ? 'นีออน' : 'สยอง';
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
}

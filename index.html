<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SundayAI - Chat Interface</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Thai', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f1115',
                        darkSidebar: '#16191f',
                        darkCard: '#1e222a',
                        darkBorder: '#2a2f3a',
                        accent: '#6366f1',
                        accentHover: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }
        /* Typing animation dots */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        /* Blinking cursor while AI is writing */
        .writing-cursor::after {
            content: '▋';
            display: inline-block;
            margin-left: 2px;
            color: #6366f1;
            animation: blinkCursor 0.8s infinite;
        }
        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 antialiased selection:bg-accent selection:text-white overflow-hidden h-screen flex">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar (Chat History & Settings) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-white dark:bg-darkSidebar border-r border-gray-200 dark:border-darkBorder flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- Sidebar Header / New Chat Button -->
        <div class="p-4 flex items-center justify-between gap-2">
            <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-accent hover:bg-accentHover text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-all active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>แชทใหม่</span>
            </button>
            <button onclick="toggleSidebar()" class="md:hidden p-2.5 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-darkCard">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Search History -->
        <div class="px-4 pb-3">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="filterChats()" placeholder="ค้นหาประวัติการแชท..." class="w-full bg-gray-100 dark:bg-darkCard text-sm rounded-xl pl-9 pr-3 py-2 border border-transparent focus:border-accent focus:outline-none transition-colors">
            </div>
        </div>

        <!-- Chat List -->
        <div class="flex-1 overflow-y-auto px-3 space-y-1" id="chatHistoryList">
            <!-- Chat items will be rendered dynamically here -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-gray-200 dark:border-darkBorder space-y-2">
            <button onclick="toggleTheme()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-darkCard transition-colors">
                <span class="flex items-center gap-2.5">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4 text-accent"></i>
                    <span id="themeText">โหมดมืด</span>
                </span>
                <span class="text-xs px-2 py-0.5 rounded-md bg-gray-200 dark:bg-darkBg text-gray-600 dark:text-gray-400">สลับ</span>
            </button>
            <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-gray-100/70 dark:bg-darkCard/70">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs shadow-sm">
                    S
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate">SundayAI Workspace</p>
                    <p id="sidebarChatId" class="text-xs text-gray-500 dark:text-gray-400 truncate">ID: c_5a2a458deec5680f</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-gray-50 dark:bg-darkBg relative">
        <!-- Top Header -->
        <header class="h-16 border-b border-gray-200 dark:border-darkBorder bg-white/80 dark:bg-darkBg/80 backdrop-blur-md px-4 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-darkCard">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <!-- Model Selector Dropdown -->
                <div class="relative">
                    <select id="modelSelect" class="appearance-none bg-gray-100 dark:bg-darkCard hover:bg-gray-200/70 dark:hover:bg-darkBorder/70 text-sm font-semibold rounded-xl pl-3.5 pr-9 py-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-accent transition-colors">
                        <option value="gemini-2.5-flash">SundayAI Pro (แนะนำ)</option>
                        <option value="gpt-4o-mini">GPT-4o Mini</option>
                        <option value="claude-3-5">Claude 3.5 Sonnet</option>
                        <option value="deepseek-r1">DeepSeek R1</option>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"></i>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span id="chatIdBadge" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded-lg bg-gray-100 dark:bg-darkCard text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-darkBorder">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    c_5a2a458deec5680f
                </span>
                <button onclick="copyShareLink()" title="คัดลอกลิงก์แชท" class="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-darkCard transition-colors">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                </button>
                <button onclick="clearCurrentChat()" title="ล้างข้อความในแชทนี้" class="p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-950/30 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto px-4 py-6 scroll-smooth">
            <div id="messagesWrapper" class="max-w-3xl mx-auto space-y-6">
                <!-- Welcome Screen (Shown when chat is empty) -->
                <div id="welcomeScreen" class="py-12 text-center space-y-6">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                        <i data-lucide="sparkles" class="w-8 h-8"></i>
                    </div>
                    <div class="space-y-2">
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">สวัสดี! มีอะไรให้ช่วยไหม?</h1>
                        <p class="text-sm sm:text-base text-gray-500 dark:text-gray-400 max-w-md mx-auto">
                            พิมพ์คำถาม ไอเดีย หรือวางโค้ดที่ต้องการให้ช่วยตรวจสอบและพัฒนาได้เลย
                        </p>
                    </div>

                    <!-- Quick Prompt Suggestions -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-2xl mx-auto pt-4 text-left">
                        <button onclick="useSuggestion('ช่วยเขียนโค้ดหน้าเว็บ Responsive ด้วย Tailwind CSS')" class="p-4 rounded-2xl bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder hover:border-accent dark:hover:border-accent transition-all group">
                            <div class="flex items-center gap-2 text-accent font-medium text-sm mb-1">
                                <i data-lucide="code-2" class="w-4 h-4"></i>
                                <span>เขียนโค้ด & พัฒนาเว็บ</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">ช่วยเขียนโค้ดหน้าเว็บ Responsive ด้วย Tailwind CSS</p>
                        </button>

                        <button onclick="useSuggestion('ช่วยคิดไอเดียคอนเทนต์โซเชียลมีเดียที่น่าสนใจ 5 ข้อ')" class="p-4 rounded-2xl bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder hover:border-accent dark:hover:border-accent transition-all group">
                            <div class="flex items-center gap-2 text-emerald-500 font-medium text-sm mb-1">
                                <i data-lucide="lightbulb" class="w-4 h-4"></i>
                                <span>ระดมความคิดสร้างสรรค์</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">ช่วยคิดไอเดียคอนเทนต์โซเชียลมีเดียที่น่าสนใจ 5 ข้อ</p>
                        </button>

                        <button onclick="useSuggestion('อธิบายการทำงานของ API แบบเข้าใจง่ายใน 3 ย่อหน้า')" class="p-4 rounded-2xl bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder hover:border-accent dark:hover:border-accent transition-all group">
                            <div class="flex items-center gap-2 text-amber-500 font-medium text-sm mb-1">
                                <i data-lucide="book-open" class="w-4 h-4"></i>
                                <span>สรุปและอธิบายความรู้</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">อธิบายการทำงานของ API แบบเข้าใจง่ายใน 3 ย่อหน้า</p>
                        </button>

                        <button onclick="useSuggestion('ช่วยแปลและเกลาประโยคภาษาอังกฤษให้ดูเป็นมืออาชีพ')" class="p-4 rounded-2xl bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder hover:border-accent dark:hover:border-accent transition-all group">
                            <div class="flex items-center gap-2 text-pink-500 font-medium text-sm mb-1">
                                <i data-lucide="languages" class="w-4 h-4"></i>
                                <span>แปลภาษาและเกลาข้อความ</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 group-hover:text-gray-700 dark:group-hover:text-gray-300">ช่วยแปลและเกลาประโยคภาษาอังกฤษให้ดูเป็นมืออาชีพ</p>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Messages will appear here -->
                <div id="chatMessages" class="space-y-6"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent dark:from-darkBg dark:via-darkBg">
            <div class="max-w-3xl mx-auto">
                <div class="relative bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder shadow-lg focus-within:border-accent dark:focus-within:border-accent transition-colors">
                    <textarea id="messageInput" rows="1" placeholder="พิมพ์ข้อความของคุณที่นี่... (กด Enter เพื่อส่ง, Shift+Enter เพื่อขึ้นบรรทัดใหม่)" class="w-full bg-transparent px-4 py-3.5 pr-24 text-sm sm:text-base resize-none focus:outline-none max-h-40 overflow-y-auto" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <div class="absolute right-2 bottom-2 flex items-center gap-1">
                        <button type="button" onclick="attachMockFile()" title="แนบไฟล์" class="p-2 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-darkBorder transition-colors">
                            <i data-lucide="paperclip" class="w-4 h-4"></i>
                        </button>
                        <button type="button" id="sendButton" onclick="sendMessage()" class="p-2.5 rounded-xl bg-accent hover:bg-accentHover text-white shadow-sm disabled:opacity-40 disabled:cursor-not-allowed transition-all active:scale-95">
                            <i data-lucide="arrow-up" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <p class="text-[11px] text-center text-gray-400 dark:text-gray-500 mt-2">
                    AI อาจแสดงข้อมูลที่คลาดเคลื่อนได้ โปรดตรวจสอบข้อมูลสำคัญอีกครั้ง
                </p>
            </div>
        </div>
    </main>

    <!-- Custom Toast Notification (Replaces alert) -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-xs font-medium px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMessage">ดำเนินการสำเร็จ</span>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Gemini API Configuration (https://generativelanguage.googleapis.com)
        const GEMINI_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/models';
        const GEMINI_API_KEY = ''; // ใส่ Gemini API Key ของคุณที่นี่ (หากว่างไว้จะใช้โหมดตอบกลับอัตโนมัติ)

        // State Management
        const urlParams = new URLSearchParams(window.location.search);
        let currentChatId = urlParams.get('id') || 'c_5a2a458deec5680f';
        let isTyping = false;
        let chats = [
            {
                id: 'c_5a2a458deec5680f',
                title: 'เริ่มต้นใช้งาน SundayAI',
                updatedAt: 'เมื่อสักครู่',
                messages: []
            }
        ];

        // DOM Elements
        const chatHistoryList = document.getElementById('chatHistoryList');
        const chatMessages = document.getElementById('chatMessages');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');
        const chatIdBadge = document.getElementById('chatIdBadge');
        const sidebarChatId = document.getElementById('sidebarChatId');

        // Update URL Query Parameter (?id=...)
        function syncUrlWithChatId(id) {
            try {
                const url = new URL(window.location);
                url.searchParams.set('id', id);
                window.history.replaceState({}, '', url);
            } catch (e) {}
        }

        // Initialize App
        function init() {
            if (!chats.find(c => c.id === currentChatId)) {
                chats.unshift({
                    id: currentChatId,
                    title: 'บทสนทนาใหม่',
                    updatedAt: 'เมื่อสักครู่',
                    messages: []
                });
            }
            renderChatList();
            loadChat(currentChatId);
        }

        // Show Custom Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        // Toggle Mobile Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Toggle Dark / Light Mode
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
                themeText.textContent = 'โหมดสว่าง';
            } else {
                html.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
                themeText.textContent = 'โหมดมืด';
            }
            lucide.createIcons();
        }

        // Render Sidebar Chat List
        function renderChatList(filter = '') {
            chatHistoryList.innerHTML = '';
            const filtered = chats.filter(c => c.title.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                chatHistoryList.innerHTML = `<p class="text-xs text-center text-gray-400 py-6">ไม่พบประวัติการแชท</p>`;
                return;
            }

            filtered.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition-colors ${
                    isActive 
                        ? 'bg-accent/10 text-accent dark:bg-accent/20 dark:text-indigo-300 font-medium' 
                        : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-darkCard'
                }`;
                item.onclick = () => {
                    loadChat(chat.id);
                    if (window.innerWidth < 768) toggleSidebar();
                };

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <i data-lucide="message-square" class="w-4 h-4 shrink-0 ${isActive ? 'text-accent' : 'text-gray-400'}"></i>
                        <div class="truncate">
                            <p class="text-sm truncate">${escapeHtml(chat.title)}</p>
                            <p class="text-[11px] text-gray-400 truncate">${chat.updatedAt}</p>
                        </div>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" title="ลบแชท" class="opacity-0 group-hover:opacity-100 p-1 rounded-lg hover:bg-red-500/10 hover:text-red-500 transition-opacity">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                chatHistoryList.appendChild(item);
            });
            lucide.createIcons();
        }

        // Filter Chats
        function filterChats() {
            const query = document.getElementById('searchInput').value;
            renderChatList(query);
        }

        // Create New Chat
        function createNewChat() {
            const randomHex = Array.from({length: 16}, () => Math.floor(Math.random() * 16).toString(16)).join('');
            const newId = `c_${randomHex}`;
            const newChat = {
                id: newId,
                title: 'บทสนทนาใหม่',
                updatedAt: 'เมื่อสักครู่',
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newId;
            renderChatList();
            loadChat(newId);
            if (window.innerWidth < 768) toggleSidebar();
            messageInput.focus();
        }

        // Delete Chat
        function deleteChat(event, id) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) {
                createNewChat();
            } else if (currentChatId === id) {
                currentChatId = chats[0].id;
                loadChat(currentChatId);
            }
            renderChatList();
            showToast('ลบประวัติการแชทแล้ว');
        }

        // Clear Current Chat Messages
        function clearCurrentChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = [];
                loadChat(currentChatId);
                showToast('ล้างข้อความในหน้านี้แล้ว');
            }
        }

        // Load Specific Chat
        function loadChat(id) {
            currentChatId = id;
            syncUrlWithChatId(id);
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            chatIdBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${chat.id}`;
            if (sidebarChatId) sidebarChatId.textContent = `ID: ${chat.id}`;
            renderChatList();

            if (chat.messages.length === 0) {
                welcomeScreen.classList.remove('hidden');
                chatMessages.innerHTML = '';
            } else {
                welcomeScreen.classList.add('hidden');
                chatMessages.innerHTML = '';
                chat.messages.forEach(msg => appendMessageToDOM(msg.role, msg.content, msg.time));
                scrollToBottom();
            }
        }

        // Format Message Content (Supports basic code blocks & bold text)
        function formatContent(text) {
            let escaped = escapeHtml(text);
            // Format code blocks ```lang ... ```
            escaped = escaped.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang || 'code';
                return `
                    <div class="my-3 rounded-xl overflow-hidden border border-gray-200 dark:border-darkBorder bg-gray-900 text-gray-100">
                        <div class="flex items-center justify-between px-3.5 py-1.5 bg-gray-800 text-xs text-gray-400">
                            <span class="font-mono">${language}</span>
                            <button onclick="copyCodeBlock(this)" class="flex items-center gap-1 hover:text-white transition-colors">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                <span>คัดลอกโค้ด</span>
                            </button>
                        </div>
                        <pre class="p-3.5 text-xs sm:text-sm font-mono overflow-x-auto leading-relaxed"><code>${code.trim()}</code></pre>
                    </div>
                `;
            });
            // Format inline code `...`
            escaped = escaped.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded-md bg-gray-200/80 dark:bg-darkBorder text-accent dark:text-indigo-300 font-mono text-xs">$1</code>');
            // Format bold **...**
            escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
            // Convert newlines to <br>
            return escaped.replace(/\n/g, '<br>');
        }

        // Append Message to DOM
        function appendMessageToDOM(role, content, time) {
            welcomeScreen.classList.add('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3.5 ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[75%] space-y-1">
                        <div class="bg-accent text-white px-4 py-3 rounded-2xl rounded-tr-sm shadow-sm text-sm sm:text-base leading-relaxed break-words">
                            ${escapeHtml(content).replace(/\n/g, '<br>')}
                        </div>
                        <p class="text-[11px] text-gray-400 text-right pr-1">${time}</p>
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shrink-0 mt-1 shadow-sm">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="max-w-[88%] sm:max-w-[80%] space-y-1.5 group">
                        <div class="bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder px-4 py-3.5 rounded-2xl rounded-tl-sm shadow-sm text-sm sm:text-base leading-relaxed break-words">
                            ${formatContent(content)}
                        </div>
                        <div class="flex items-center gap-3 px-1 text-gray-400">
                            <span class="text-[11px]">${time}</span>
                            <button onclick="copyPlainText(this)" data-text="${escapeHtml(content)}" class="opacity-0 group-hover:opacity-100 flex items-center gap-1 text-[11px] hover:text-accent transition-opacity">
                                <i data-lucide="copy" class="w-3 h-3"></i>
                                <span>คัดลอก</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            chatMessages.appendChild(wrapper);
            lucide.createIcons();
            scrollToBottom();
        }

        // Stream/Typewriter Effect when AI is writing response
        function streamMessageToDOM(fullContent, time, onComplete) {
            welcomeScreen.classList.add('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex gap-3.5 justify-start';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shrink-0 mt-1 shadow-sm">
                    <i data-lucide="bot" class="w-4 h-4"></i>
                </div>
                <div class="max-w-[88%] sm:max-w-[80%] space-y-1.5 group">
                    <div class="ai-bubble bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder px-4 py-3.5 rounded-2xl rounded-tl-sm shadow-sm text-sm sm:text-base leading-relaxed break-words writing-cursor"></div>
                    <div class="ai-actions hidden flex items-center gap-3 px-1 text-gray-400">
                        <span class="text-[11px]">${time}</span>
                        <button onclick="copyPlainText(this)" data-text="${escapeHtml(fullContent)}" class="opacity-0 group-hover:opacity-100 flex items-center gap-1 text-[11px] hover:text-accent transition-opacity">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span>คัดลอก</span>
                        </button>
                    </div>
                </div>
            `;

            chatMessages.appendChild(wrapper);
            lucide.createIcons();

            const bubble = wrapper.querySelector('.ai-bubble');
            const actions = wrapper.querySelector('.ai-actions');
            let currentIndex = 0;
            const totalLength = fullContent.length;

            // Adjust chunk speed dynamically based on message length
            const step = totalLength > 300 ? 4 : 2;

            const interval = setInterval(() => {
                currentIndex = Math.min(currentIndex + step, totalLength);
                const partialText = fullContent.slice(0, currentIndex);
                bubble.innerHTML = formatContent(partialText);
                scrollToBottom();

                if (currentIndex >= totalLength) {
                    clearInterval(interval);
                    bubble.classList.remove('writing-cursor');
                    actions.classList.remove('hidden');
                    lucide.createIcons();
                    if (onComplete) onComplete();
                }
            }, 18);
        }

        // Show Typing Indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.id = 'typingIndicator';
            indicator.className = 'flex gap-3.5 justify-start';
            indicator.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shrink-0 mt-1">
                    <i data-lucide="bot" class="w-4 h-4"></i>
                </div>
                <div class="bg-white dark:bg-darkCard border border-gray-200 dark:border-darkBorder px-4 py-3.5 rounded-2xl rounded-tl-sm flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-gray-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-400 typing-dot"></span>
                </div>
            `;
            chatMessages.appendChild(indicator);
            lucide.createIcons();
            scrollToBottom();
        }

        // Remove Typing Indicator
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Send Message Handler
        async function sendMessage() {
            if (isTyping) return;
            const text = messageInput.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            // Update title if it's the first message
            if (chat.messages.length === 0) {
                chat.title = text.length > 32 ? text.substring(0, 32) + '...' : text;
                renderChatList();
            }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            // Add user message
            chat.messages.push({ role: 'user', content: text, time: timeStr });
            appendMessageToDOM('user', text, timeStr);

            // Reset input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Call Google Gemini API if API Key is provided
            isTyping = true;
            showTypingIndicator();
            const selectedModel = document.getElementById('modelSelect').value;

            if (GEMINI_API_KEY) {
                try {
                    const modelEndpoint = 'gemini-3-flash-preview';
                    const apiUrl = `${GEMINI_BASE_URL}/${modelEndpoint}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
                    const contents = chat.messages.map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [{ text: m.content }]
                    }));

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents,
                            systemInstruction: {
                                parts: [{ text: 'คุณคือ SundayAI ผู้ช่วยอัจฉริยะ ตอบคำถามเป็นภาษาไทยอย่างสุภาพ ชัดเจน และเป็นประโยชน์' }]
                            }
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.error?.message || 'ไม่สามารถเชื่อมต่อ Gemini API ได้');
                    }
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่ได้รับข้อความตอบกลับจาก Gemini';
                    removeTypingIndicator();
                    chat.messages.push({ role: 'ai', content: reply, time: timeStr });
                    streamMessageToDOM(reply, timeStr, () => {
                        isTyping = false;
                    });
                } catch (err) {
                    removeTypingIndicator();
                    const errMsg = `เกิดข้อผิดพลาดในการเชื่อมต่อ Gemini API: ${err.message}`;
                    chat.messages.push({ role: 'ai', content: errMsg, time: timeStr });
                    streamMessageToDOM(errMsg, timeStr, () => {
                        isTyping = false;
                    });
                }
                return;
            }

            setTimeout(() => {
                removeTypingIndicator();
                const reply = generateSmartReply(text, selectedModel);
                chat.messages.push({ role: 'ai', content: reply, time: timeStr });
                streamMessageToDOM(reply, timeStr, () => {
                    isTyping = false;
                });
            }, 700);
        }

        // Simulated Smart AI Responses
        function generateSmartReply(prompt, model) {
            const lower = prompt.toLowerCase();
            if (lower.includes('โค้ด') || lower.includes('code') || lower.includes('html') || lower.includes('tailwind')) {
                return `นี่คือตัวอย่างโค้ดปุ่มสวยงามด้วย **Tailwind CSS** จากโมเดล **${model}** ครับ:\n\n\`\`\`html\n<button class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md transition-all">\n  คลิกที่นี่\n</button>\n\`\`\`\n\nคุณสามารถนำไปปรับแต่งสีและขนาดเพิ่มเติมได้ตามต้องการเลยครับ!`;
            }
            if (lower.includes('api')) {
                return `**API (Application Programming Interface)** เปรียบเสมือน "พนักงานเสิร์ฟ" ในร้านอาหารครับ:\n\n1. **คุณ (Client)** สั่งอาหารผ่านเมนู\n2. **พนักงานเสิร์ฟ (API)** นำคำสั่งไปส่งให้ห้องครัว\n3. **ห้องครัว (Server)** ปรุงอาหารและส่งกลับมาให้คุณผ่านพนักงานเสิร์ฟ\n\nและหากต้องการเชื่อมต่อโค้ดหน้าเว็บนี้กับ Backend ในโปรเจกต์ **SundayAIi** เพียงใส่ URL ที่ตัวแปร \`API_ENDPOINT\` ในไฟล์ HTML ได้เลยครับ`;
            }
            return `ได้รับข้อความของคุณเรียบร้อยแล้วครับ! (**โมเดล: ${model}**)\n\nคุณพิมพ์ว่า: *"${prompt}"*\n\nหน้าเว็บ **SundayAI** นี้พร้อมนำไปใช้งานใน GitHub Repository ของคุณทันที หากต้องการเชื่อมต่อกับ Backend สามารถกำหนดค่าที่ตัวแปร \`API_ENDPOINT\` ในส่วนสคริปต์ได้เลยครับ`;
        }

        // Suggestion Card Click
        function useSuggestion(text) {
            messageInput.value = text;
            sendMessage();
        }

        // Auto Resize Textarea
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }

        // Handle Enter vs Shift+Enter
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Scroll Messages to Bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Copy Helpers (Using execCommand for iFrame compatibility)
        function copyToClipboard(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (err) {
                showToast('ไม่สามารถคัดลอกได้');
            }
            document.body.removeChild(textarea);
        }

        function copyShareLink() {
            const url = `${window.location.origin}/chat?id=${currentChatId}`;
            copyToClipboard(url, `คัดลอกลิงก์แชท (${currentChatId}) แล้ว`);
        }

        function copyCodeBlock(btn) {
            const code = btn.closest('div').nextElementSibling.innerText;
            copyToClipboard(code, 'คัดลอกโค้ดลงคลิปบอร์ดแล้ว');
        }

        function copyPlainText(btn) {
            const text = btn.getAttribute('data-text');
            copyToClipboard(text, 'คัดลอกข้อความแล้ว');
        }

        function attachMockFile() {
            showToast('รองรับการอัปโหลดไฟล์เมื่อเชื่อมต่อ Backend API');
        }

        // Escape HTML Utility
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Run App
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
